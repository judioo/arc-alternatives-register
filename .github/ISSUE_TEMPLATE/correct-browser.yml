name: Correct a browser
description: Something in the register is wrong or out of date
labels: [correction]
body:
  - type: input
    id: name
    attributes: { label: Browser }
    validations: { required: true }
  - type: textarea
    id: wrong
    attributes: { label: What's wrong, and what it should say }
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: A public link that shows it }
    validations: { required: true }
